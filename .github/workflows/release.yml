name: Release CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - main
      - master
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RESONITE_INSTALL_DIR: ${{ github.workspace }}\Resonite

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw .\Directory.Build.props
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }

      - name: Verify whitespace formatting
        run: dotnet format whitespace --verify-no-changes

  build:
    runs-on: windows-latest
    needs: formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare build references
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RESONITE_INSTALL_DIR\Libraries" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RESONITE_INSTALL_DIR\rml_libs" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll" -OutFile "$env:RESONITE_INSTALL_DIR\Libraries\ResoniteModLoader.dll"
          Invoke-WebRequest -Uri "https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll" -OutFile "$env:RESONITE_INSTALL_DIR\rml_libs\0Harmony.dll"

      - name: Restore
        run: dotnet restore .\TurboAudioStream\TurboAudioStream.csproj --locked-mode -p:ResonitePath="${{ env.RESONITE_INSTALL_DIR }}\"

      - name: Build
        run: dotnet build .\TurboAudioStream\TurboAudioStream.csproj -c Release --no-restore -p:ResonitePath="${{ env.RESONITE_INSTALL_DIR }}\"

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item .\TurboAudioStream\bin\Release\TurboAudioStream.dll .\artifacts\
          if (Test-Path .\TurboAudioStream\bin\Release\TurboAudioStream.pdb) {
            Copy-Item .\TurboAudioStream\bin\Release\TurboAudioStream.pdb .\artifacts\
          }
          if (Test-Path .\TurboAudioStream\bin\Release\TurboAudioStream.xml) {
            Copy-Item .\TurboAudioStream\bin\Release\TurboAudioStream.xml .\artifacts\
          }

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: turbo-audio-stream
          path: artifacts
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: turbo-audio-stream
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/TurboAudioStream.dll
            artifacts/TurboAudioStream.pdb
            artifacts/TurboAudioStream.xml
